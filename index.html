<!DOCTYPE <!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوتیک ترنج | مزون آنلاین لباس زنانه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c25975;
      --primary-dark: #9e3d56;
      --primary-light: #fbeff2;
      --accent: #d4a373;
      --dark: #1f2421;
      --gray: #6c757d;
      --light-gray: #f8f9fa;
      --border: #ececec;
      --success: #25d366;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #faf9f6;
      color: var(--dark);
      line-height: 1.6;
      padding-bottom: 90px;
    }

    /* Top Offer Bar */
    .top-bar {
      background: linear-gradient(90deg, #9e3d56, #c25975);
      color: #fff;
      text-align: center;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .countdown-timer {
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--dark);
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(194, 89, 117, 0.3);
    }
    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--dark);
    }
    .brand-text span {
      font-size: 0.72rem;
      color: var(--gray);
      display: block;
    }

    .cart-btn {
      position: relative;
      background: var(--primary-light);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .cart-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--primary);
    }
    .cart-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--primary);
      color: white;
      font-size: 0.75rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      border: 2px solid white;
    }

    /* Hero Banner */
    .hero {
      padding: 24px 20px 10px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero-card {
      background: linear-gradient(135deg, #fdf6f7 0%, #fae8ed 100%);
      border: 1px solid #f3d3dc;
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .hero-tag {
      align-self: flex-start;
      background: var(--primary);
      color: white;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 30px;
      font-weight: 600;
    }
    .hero-card h2 {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--dark);
      line-height: 1.4;
    }
    .hero-card p {
      font-size: 0.9rem;
      color: var(--gray);
    }

    /* Search & Filter */
    .controls {
      max-width: 1200px;
      margin: 15px auto 20px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.92rem;
      background: white;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 89, 117, 0.15);
    }
    .search-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--gray);
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .cat-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gray);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(194, 89, 117, 0.25);
    }

    /* Product Grid */
    .products-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 768px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
    }
    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .product-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }
    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(194, 89, 117, 0.9);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 8px;
      z-index: 2;
    }
    .card-img-wrap {
      width: 100%;
      height: 240px;
      background: #f0f0f0;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .card-img-wrap img {
      transform: scale(1.04);
    }
    .card-content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 10px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--dark);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
      cursor: pointer;
    }
    .prices {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .old-price {
      font-size: 0.8rem;
      color: #a0a0a0;
      text-decoration: line-through;
    }
    .current-price {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .current-price span {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--gray);
      margin-right: 4px;
    }

    .btn-detail {
      width: 100%;
      background: var(--light-gray);
      color: var(--dark);
      border: 1px solid var(--border);
      padding: 9px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-detail:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Modal (Product Details) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      padding: 24px;
      animation: slideUp 0.3s ease;
      position: relative;
    }
    @media (min-width: 600px) {
      .modal-card {
        border-radius: 24px;
      }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .close-modal {
      position: absolute;
      left: 20px;
      top: 20px;
      background: #eee;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .modal-img {
      width: 100%;
      height: 300px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 0.88rem;
      color: var(--gray);
      margin-bottom: 16px;
      line-height: 1.7;
    }
    .selector-label {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }
    .option-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .option-chip {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .option-chip.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    .btn-add-cart {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(194, 89, 117, 0.3);
    }

    /* Cart Drawer / Checkout */
    .cart-drawer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: none;
      justify-content: flex-end;
    }
    .drawer-content {
      background: white;
      width: 100%;
      max-width: 440px;
      height: 100%;
      display: flex;
      flex-direction: column;
      animation: slideLeft 0.3s ease;
    }
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-header h3 {
      font-size: 1.1rem;
      font-weight: 800;
    }
    .drawer-body {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .cart-item {
      display: flex;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .cart-item img {
      width: 65px;
      height: 65px;
      border-radius: 12px;
      object-fit: cover;
    }
    .cart-item-info {
      flex-grow: 1;
    }
    .cart-item-title {
      font-size: 0.88rem;
      font-weight: 700;
    }
    .cart-item-meta {
      font-size: 0.75rem;
      color: var(--gray);
      margin: 2px 0 4px;
    }
    .cart-item-price {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
    }
    .remove-btn {
      background: none;
      border: none;
      color: #e63946;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 6px;
    }

    /* Checkout Inputs */
    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      padding-top: 15px;
      border-top: 2px dashed var(--border);
    }
    .checkout-form input, .checkout-form textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .checkout-form input:focus, .checkout-form textarea:focus {
      border-color: var(--primary);
    }

    .drawer-footer {
      padding: 18px 20px;
      border-top: 1px solid var(--border);
      background: var(--light-gray);
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .btn-whatsapp {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.35);
    }

    /* Empty state */
    .empty-box {
      text-align: center;
      padding: 40px 10px;
      color: var(--gray);
    }

    /* Floating WhatsApp Button for inquiries */
    .floating-wa {
      position: fixed;
      bottom: 24px;
      left: 20px;
      background: var(--success);
      color: white;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
      z-index: 90;
      cursor: pointer;
      text-decoration: none;
    }
    .floating-wa svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar with Timer -->
  <div class="top-bar">
    <span>🔥 تخفیف ویژه فصل بهاره | مهلت باقی‌مانده:</span>
    <span class="countdown-timer" id="timer">04:12:45</span>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="brand">
      <div class="brand-logo">ت</div>
      <div class="brand-text">
        <h1>مزون ترنج</h1>
        <span>لباس‌های شیک و مزونی زنانه</span>
      </div>
    </a>
    <button class="cart-btn" onclick="toggleCart()">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span class="cart-badge" id="cartCount">0</span>
    </button>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-card">
      <span class="hero-tag">کالکشن جدید</span>
      <h2>استایل خاص و چشم‌نواز با بهترین پارچه‌های وارداتی</h2>
      <p>ارسال رایگان برای خریدهای بالای ۸۰۰ هزار تومان به سراسر کشور</p>
    </div>
  </section>

  <!-- Controls: Search & Categories -->
  <section class="controls">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="جستجوی مدل، مانتو، کت، شال..." oninput="handleSearch()">
    </div>
    <div class="categories" id="categoryList">
      <button class="cat-btn active" onclick="filterCategory('همه')">همه محصولات</button>
      <button class="cat-btn" onclick="filterCategory('مانتو')">مانتو</button>
      <button class="cat-btn" onclick="filterCategory('کت')">کت تک</button>
      <button class="cat-btn" onclick="filterCategory('شومیز')">شومیز</button>
      <button class="cat-btn" onclick="filterCategory('شال')">شال و روسری</button>
    </div>
  </section>

  <!-- Products Grid -->
  <main class="products-container">
    <div class="product-grid" id="productGrid">
      <!-- محصولات توسط جاوااسکریپت اینجا درج می‌شوند -->
    </div>
  </main>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <button class="close-modal" onclick="closeModal()">✕</button>
      <img src="" id="modalImg" class="modal-img" alt="">
      <h3 class="modal-title" id="modalTitle"></h3>
      <p class="modal-desc" id="modalDesc"></p>
      
      <span class="selector-label">انتخاب سایز:</span>
      <div class="option-list" id="modalSizes"></div>

      <span class="selector-label">انتخاب رنگ:</span>
      <div class="option-list" id="modalColors"></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin: 15px 0 20px;">
        <span style="font-weight:600; color:var(--gray);">قیمت محصول:</span>
        <span class="current-price" id="modalPrice"></span>
      </div>

      <button class="btn-add-cart" onclick="addCurrentToCart()">
        <svg style="width:20px;height:20px;fill:white" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        افزودن به سبد خرید
      </button>
    </div>
  </div>

  <!-- Cart / Checkout Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3>سبد خرید شما</h3>
        <button class="close-modal" style="position:static;" onclick="toggleCart()">✕</button>
      </div>

      <div class="drawer-body" id="cartItems">
        <!-- آیتم‌های سبد خرید -->
      </div>

      <div class="drawer-footer">
        <div class="total-row">
          <span>مبلغ قابل پرداخت:</span>
          <span id="cartTotal" style="color:var(--primary-dark);">۰ تومان</span>
        </div>

        <!-- فیلدهای آدرس برای ارسال به واتساپ -->
        <div class="checkout-form">
          <input type="text" id="custName" placeholder="نام و نام خانوادگی شما">
          <input type="tel" id="custPhone" placeholder="شماره موبایل جهت هماهنگی">
          <textarea id="custAddress" rows="2" placeholder="آدرس دقیق پستی + کد پستی"></textarea>
        </div>

        <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()" style="margin-top:12px;">
