<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشیار</title>
  <style>
    body { font-family: Tahoma, sans-serif; text-align: center; padding: 60px 20px; background: #f0f4f8; margin: 0; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #1a56db; font-size: 28px; }
    p { color: #555; font-size: 16px; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 20px; padding: 12px 30px; background: #1a56db; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 به فروشیار خوش آمدید</h1>
    <p>وب‌سایت رسمی فروشیار در حال آماده‌سازی است.</p>
    <a class="btn" href="#">بزودی...</a>
  </div>
</body>
</html>
